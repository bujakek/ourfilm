name: Supabase production migration

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link production project
        run: |
          pnpm supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      # `--include-all` applies migrations whose timestamp predates the last one
      # already on the remote. Two branches that merge out of order produce
      # exactly that: #16 merged first and applied 20260831133000 and
      # 20260831150000, then #17 — branched earlier — brought 20260831120000 and
      # 20260831121000 along behind them. Without the flag `db push` refuses the
      # whole batch, which is how production ended up missing `events.locale`
      # and `rate_limits` while the code that reads them was already deployed.
      #
      # The dry run that follows is the safety net the flag removes: it prints
      # the exact list before anything is applied, and the Production
      # environment still gates the apply step on a human.
      - name: Preview pending migrations
        run: |
          pnpm supabase db push \
            --linked \
            --dry-run \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: |
          pnpm supabase db push \
            --linked \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Verify committed types match production
        run: pnpm types:check
