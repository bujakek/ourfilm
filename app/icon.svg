<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    OurFilm mark: a disposable camera, where the icon's rounded square is the
    body. That leaves the mark itself just two shapes, the lens and the flash,
    which is the whole budget a 16px favicon has — a third element turns to
    mush at tab size, and the flash was already re-laid-out once to stop it
    reading as a speck stuck to the lens.

    Fixed colours rather than a prefers-color-scheme swap: the product is
    dark-only (`color-scheme: dark`, app/globals.css), so a light variant would
    be a face the app never wears. The hairline is the glass border token, and
    it is what keeps the near-black body off the edge of a dark tab strip.
  -->
  <rect width="180" height="180" rx="40" fill="#050505" />
  <rect
    x="0.75"
    y="0.75"
    width="178.5"
    height="178.5"
    rx="39.25"
    stroke="#F7F7F7"
    stroke-opacity="0.12"
    stroke-width="1.5"
  />
  <rect x="96" y="24" width="52" height="26" rx="13" fill="#C3B6FF" />
  <circle cx="90" cy="112" r="32" stroke="#C3B6FF" stroke-width="26" />
</svg>
